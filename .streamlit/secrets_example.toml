# RENAME THIS FILE TO secrets.toml FOR LOCAL TESTING.
# On Streamlit Community Cloud, paste this content into:
# App settings -> Secrets (do NOT upload secrets.toml to a public GitHub repo)

APP_USERNAME = "any name"
APP_PASSWORD = "password"

# Get this from Supabase (or Neon): Project Settings -> Database -> Connection string (URI)
# Use the "Session pooler" or "Transaction pooler" URI, port 6543, and make sure
# it starts with postgresql:// (not postgres://)
DB_URL = ""
#postgresql://postgres.knprqhalgkbehdhvelzt:[YOUR-PASSWORD]@aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres

# The long ID in your Google Sheet's URL:
# https://docs.google.com/spreadsheets/d/THIS_IS_THE_SHEET_ID/edit
GOOGLE_SHEET_ID = "google sheet link"

# Paste the ENTIRE contents of the service account JSON key file here,
# as a TOML table (keep the [gcp_service_account] header).
[gcp_service_account]
type = "service_account"
project_id = "your-project-id"
private_key_id = "xxxx"
private_key = "-----BEGIN PRIVATE KEY-----\nXXXX\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project-id.iam.gserviceaccount.com"
client_id = "xxxx"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project-id.iam.gserviceaccount.com"
